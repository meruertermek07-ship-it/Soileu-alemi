<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сөйлеу әлеміне саяхат</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>ДИСЛАЛИЯНЫ ТҮЗЕТУ БАҒДАРЛАМАСЫ</h1>
    <h2>🌈 СӨЙЛЕУ ӘЛЕМІНЕ САЯХАТ</h2>
    <p>Дыбыстар әлеміне саяхатымызды бастаймыз!</p>
    <button onclick="showSounds()">САЯХАТТЫ БАСТАУ 🚀</button>
</header>
<main>
    <section id="sounds" class="hidden">
        <h2>ДЫБЫСТЫ ТАҢДА</h2>
        <div id="soundList" class="grid"></div>
    </section>
<section id="stages" class="hidden">
    <button onclick="backToSounds()">← Артқа</button>
    <h2 id="selectedSound"></h2>
    <div id="stageList" class="grid"></div>
</section>
<section id="tasks" class="hidden">
    <button onclick="backToStages()">← Артқа</button>
    <h2 id="stageTitle"></h2>
    <div id="taskList" class="grid"></div>
</section>
<section id="taskDetail" class="hidden">
    <button onclick="backToTasks()">← Артқа</button>
    <h2 id="detailTitle"></h2>
    <div id="detailContent"></div>
    <button onclick="completeTask()">ОРЫНДАДЫМ ✓</button>
    <p id="feedback"></p>
</section>
<section id="results" class="hidden">
    <h2>🏆 МЕНІҢ НӘТИЖЕМ</h2>
    <p id="resultText"></p>
    <button onclick="showDiploma()">ДИПЛОМ АЛУ</button>
</section>
<section id="diploma" class="hidden">
    <h1>🏅 ДЫБЫСТАР ШЕБЕРІ</h1>
    <p>Бұл диплом сөйлеу әлеміндегі тапсырмаларды орындағаны үшін беріледі!</p>
    <p id="diplomaResult"></p>
</section>
</main>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
